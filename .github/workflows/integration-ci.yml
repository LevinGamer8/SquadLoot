name: SquadLoot Integration CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [integration/**]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install UI smoke-test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb python3-tk
      - name: Compile
        run: python3 -m compileall -q SquadLoot-Pi-Server SquadLoot-Windows-Client
      - name: Tests
        run: xvfb-run -a python3 -m unittest discover -s tests -v
      - name: Parse embedded web dashboard JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('SquadLoot-Pi-Server/app/dashboard.html').read_text()
          script = html.split('<script>', 1)[1].split('</script>', 1)[0]
          Path('/tmp/squadloot-dashboard.js').write_text(script)
          PY
          node --check /tmp/squadloot-dashboard.js
      - name: Build update archives and verify manifest
        run: |
          python3 scripts/build_release.py --version "$(cat SquadLoot-Pi-Server/VERSION)" --repository "$GITHUB_REPOSITORY" --output dist
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          meta=json.loads(Path('dist/latest.json').read_text())
          for prefix in ('','client_'):
              key='package_' if not prefix else 'client_package_'
              url=meta[key+'url']
              p=Path('dist')/url.split('/')[-1]
              assert p.is_file(),p
              assert p.stat().st_size==meta[key+'size']
              assert hashlib.sha256(p.read_bytes()).hexdigest()==meta[key+'sha256']
          print('SHA-256 and package sizes verified')
          PY

  windows-managed-engines:
    if: github.event_name == 'pull_request' && contains(github.head_ref, 'one-click-live-auto-replay')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify original pinned third-party runtime startup
        shell: bash
        run: |
          python - <<'PY'
          import pathlib, sys, tempfile, subprocess
          sys.path.insert(0, 'SquadLoot-Windows-Client')
          from vision import ManagedComponentStore
          with tempfile.TemporaryDirectory(prefix='squadloot-ci-') as temp:
              store = ManagedComponentStore(root=pathlib.Path(temp))
              replay = store.ensure_replay()
              assert replay.is_file()
              test = subprocess.run([str(replay), '--help'], capture_output=True,
                                    text=True, errors='replace', timeout=40)
              assert test.returncode == 0, ('Replay failed', test.stderr[-1000:])
              print('Replay CLI --help verified')
              demos = pathlib.Path(temp) / 'empty-demos'
              data = pathlib.Path(temp) / 'replay-data'
              demos.mkdir()
              data.mkdir()
              test = subprocess.run(
                  [str(replay), '--once', '--data', str(data),
                   '--demos', str(demos), '--lang', 'en'],
                  capture_output=True, text=True, errors='replace', timeout=65)
              assert test.returncode == 0, ('Passive --once failed',
                                            test.stderr[-1200:], test.stdout[-1200:])
              print('Passive Replay --once verified with empty demos')
              live = store.ensure_visual()
              py = store.visual_python()
              assert py.is_file()
              test = subprocess.run(
                  [str(py), '-m', 'fortnite_chest_counter', '--version'],
                  cwd=live, capture_output=True, text=True, errors='replace',
                  timeout=45)
              assert test.returncode == 0, ('Live worker failed', test.stderr[-1000:])
              print('Visual headless runtime verified', test.stdout.strip())
          PY
