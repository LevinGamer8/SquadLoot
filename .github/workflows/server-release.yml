name: Publish SquadLoot (Pi and Windows)
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in VERSION files, e.g. 1.3.0'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    name: Verify and publish Pi + Windows clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        env:
          TAG: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate source and run tests
        run: |
          python3 -m compileall -q SquadLoot-Pi-Server SquadLoot-Windows-Client
          python3 -m unittest discover -s tests -v
      - name: Package server and client
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build_release.py --version "$VERSION" --repository "$GH_REPO" --output dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          TAG="v$VERSION"
          gh release create "$TAG" dist/*.zip dist/latest.json dist/SQUADLOOT_INSTALLIEREN.* \
            --target "$GITHUB_SHA" --latest --title "SquadLoot $TAG" \
            --notes "SquadLoot $TAG: Pi + Windows, Beta-Live-Erkennung und automatische Updates. Keine echten Fortnite-Ereignisse während des Matches verifiziert."
