name: Publish SquadLoot (Pi and Windows)
on:
  push:
    # Updating VERSION on main publishes a release. Tags also work as before.
    branches:
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'SquadLoot-Pi-Server/VERSION'
      - 'SquadLoot-Windows-Client/VERSION'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in VERSION files, e.g. 1.3.1'
        required: true
        type: string
permissions:
  contents: write
jobs:
  release:
    name: Verify and publish Pi + Windows clients
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Determine version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = 'workflow_dispatch' ]; then
            VERSION="$MANUAL_VERSION"
          elif [ "$REF_TYPE" = 'tag' ]; then
            VERSION="${REF_NAME#v}"
          else
            VERSION="$(cat SquadLoot-Pi-Server/VERSION)"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate source and run tests
        run: |
          python3 -m compileall -q SquadLoot-Pi-Server SquadLoot-Windows-Client
          python3 -m unittest discover -s tests -v
      - name: Package server and client
        env:
          VERSION: ${{ steps.version.outputs.value }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/build_release.py --version "$VERSION" --repository "$GH_REPO" --output dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        shell: bash
        run: |
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite published artifacts."
            exit 0
          fi
          gh release create "$TAG" dist/*.zip dist/latest.json dist/SQUADLOOT_INSTALLIEREN.* \
            --target "$GITHUB_SHA" --latest --title "SquadLoot $TAG" \
            --notes "SquadLoot $TAG: Automatic passive Replay analysis and one-click optional live tracking with headless, SHA256-pinned analysis runtimes. Existing match data are preserved. German live recognition needs a verified template on new PCs; Windows/Fortnite validation remains pending."
